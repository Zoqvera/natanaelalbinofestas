name: Security checks

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read

jobs:
  static-security:
    name: Static security guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate security invariants
        shell: bash
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlparse
          import re

          failures = []
          root = Path(".")
          workflow_path = Path(".github/workflows/security.yml")

          insecure_patterns = (
              re.compile(r"(?:src|href)\s*=\s*[\"']http://", re.IGNORECASE),
              re.compile(r"url\(\s*[\"']?http://", re.IGNORECASE),
          )
          dangerous_js_patterns = (
              re.compile(r"\beval\s*\("),
              re.compile(r"\bnew\s+Function\s*\("),
              re.compile(r"\bdocument\.write\s*\("),
              re.compile(r"javascript:", re.IGNORECASE),
          )
          secret_patterns = (
              re.compile(r"-----BEGIN (?:[A-Z0-9 ]+)?PRIVATE KEY-----"),
              re.compile(r"\bgh[pousr]_[A-Za-z0-9_]{20,}\b"),
              re.compile(r"\bgithub_pat_[A-Za-z0-9_]{20,}\b"),
              re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
              re.compile(r"\bAIza[0-9A-Za-z_-]{30,}\b"),
              re.compile(r"\bsk-(?:proj-)?[A-Za-z0-9_-]{20,}\b"),
          )

          text_extensions = {".html", ".css", ".js", ".json", ".yml", ".yaml"}

          for path in root.rglob("*"):
              if not path.is_file() or ".git" in path.parts:
                  continue

              if path.suffix.lower() not in text_extensions and not path.name.startswith(".env"):
                  continue

              text = path.read_text(encoding="utf-8")

              if path.suffix.lower() in {".html", ".css", ".js"}:
                  for pattern in insecure_patterns:
                      if pattern.search(text):
                          failures.append(f"{path}: insecure http:// browser resource detected")
                          break

              if path.suffix.lower() == ".html":
                  if re.search(r"\son[a-zA-Z]+\s*=", text):
                      failures.append(f"{path}: inline JavaScript event handler detected")
                  if re.search(r"<style(?:\s|>)", text, re.IGNORECASE):
                      failures.append(f"{path}: inline <style> block detected")
                  if re.search(r"\sstyle\s*=", text, re.IGNORECASE):
                      failures.append(f"{path}: inline style attribute detected")

              if path.suffix.lower() == ".js":
                  for pattern in dangerous_js_patterns:
                      if pattern.search(text):
                          failures.append(f"{path}: dangerous JavaScript execution primitive detected")
                          break

              if path != workflow_path and path.suffix.lower() != ".md":
                  for pattern in secret_patterns:
                      if pattern.search(text):
                          failures.append(f"{path}: possible committed credential detected")
                          break

          class SecurityParser(HTMLParser):
              def __init__(self, path):
                  super().__init__()
                  self.path = path

              def handle_starttag(self, tag, attrs):
                  values = dict(attrs)

                  if tag == "form":
                      failures.append(
                          f"{self.path}: form detected; add forms only after a server-side security review"
                      )

                  if tag == "script" and not values.get("src"):
                      script_type = (values.get("type") or "").lower()
                      if script_type != "application/ld+json":
                          failures.append(
                              f"{self.path}: executable inline script detected; keep executable JavaScript in local files"
                          )

                  if tag != "a" or values.get("target") != "_blank":
                      return

                  href = values.get("href", "")
                  scheme = urlparse(href).scheme
                  if scheme not in {"http", "https"}:
                      return

                  rel = set((values.get("rel") or "").lower().split())
                  if not {"noopener", "noreferrer"}.issubset(rel):
                      failures.append(
                          f"{self.path}: target=_blank link is missing rel=\"noopener noreferrer\": {href}"
                      )

          for path in root.rglob("*.html"):
              if ".git" in path.parts:
                  continue
              parser = SecurityParser(path)
              parser.feed(path.read_text(encoding="utf-8"))

          if failures:
              raise SystemExit("\n".join(failures))
          PY

  codeql:
    name: CodeQL JavaScript analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: javascript-typescript

      - name: Analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
